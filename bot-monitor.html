<title>MemeScan Bot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="/bot-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bot Monitor">
<meta name="theme-color" content="#090c14">
<link rel="apple-touch-icon" href="/bot-icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* Dark terminal — single committed theme */
:root {
  --bg:     #090c14;
  --bg2:    #0f1420;
  --bg3:    #171e2e;
  --border: #1e2a40;
  --fg:     #dde4f0;
  --fg2:    #7988a6;
  --fg3:    #3a4560;
  --green:  #2ec27e;
  --red:    #e8534a;
  --yellow: #e8a838;
  --blue:   #4098d6;
  --accent: #4f6ef7;
  --mono:   'JetBrains Mono', Consolas, monospace;
  --sans:   'Inter', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
}

#app { max-width: 960px; margin: 0 auto; }

/* ── Setup ─────────────────────────────────────────────────────────────────── */
.setup {
  max-width: 460px;
  margin: 48px auto 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px;
}
.setup-icon { font-size: 32px; margin-bottom: 16px; }
.setup h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
.setup .sub { color: var(--fg2); font-size: 13px; margin: 0 0 28px; }
.field-label {
  font-size: 11px; color: var(--fg3); text-transform: uppercase;
  letter-spacing: .07em; font-weight: 500; margin-bottom: 5px; display: block;
}
.field-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font-family: var(--mono);
  font-size: 13px;
  padding: 9px 12px;
  margin-bottom: 18px;
  outline: none;
  transition: border-color .15s;
}
.field-input:focus { border-color: var(--accent); }
.field-hint { font-size: 11px; color: var(--fg3); margin: -13px 0 18px; }
.setup-err { color: var(--red); font-size: 12px; margin-top: 10px; }

/* ── Header ─────────────────────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.logo-row { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, #4f6ef7 0%, #2ec27e 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.logo-name { font-size: 15px; font-weight: 600; }
.logo-sub  { font-size: 11px; color: var(--fg2); }

.header-right { display: flex; align-items: center; gap: 10px; }
.live-badge {
  display: flex; align-items: center; gap: 5px;
  background: rgba(46,194,126,.1); border: 1px solid rgba(46,194,126,.2);
  border-radius: 20px; padding: 3px 9px;
  font-size: 11px; color: var(--green); font-weight: 500;
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }
.update-time { font-family: var(--mono); font-size: 11px; color: var(--fg3); }

/* ── Buttons ─────────────────────────────────────────────────────────────────── */
.btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 9px 20px;
  font-size: 14px; font-weight: 500; font-family: var(--sans);
  cursor: pointer; transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn-ghost {
  background: var(--bg3); color: var(--fg2);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 5px 12px; font-size: 12px; cursor: pointer;
  font-family: var(--sans); transition: background .15s;
}
.btn-ghost:hover { background: var(--border); }
.btn-link { background: none; border: none; color: var(--fg3); font-size: 11px; cursor: pointer; padding: 0; }

/* ── Sell button ──────────────────────────────────────────────────────────────── */
.sell-btn {
  background: rgba(232,83,74,.12); color: var(--red);
  border: 1px solid rgba(232,83,74,.3); border-radius: 6px;
  padding: 4px 10px; font-size: 11px; font-weight: 600;
  font-family: var(--sans); cursor: pointer; white-space: nowrap;
  transition: background .15s;
}
.sell-btn:hover  { background: rgba(232,83,74,.25); }
.sell-btn.confirm {
  background: var(--red); color: #fff; border-color: var(--red);
  animation: pulse-red .4s ease;
}
@keyframes pulse-red { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
.sell-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── pnl split row ────────────────────────────────────────────────────────────── */
.pnl-split {
  display: flex; gap: 6px; align-items: center;
  font-size: 10px; color: var(--fg3); margin-top: 3px;
  font-family: var(--mono);
}
.pnl-split-tag {
  padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em;
}
.pnl-split-tag.auto   { background: rgba(79,110,247,.15); color: #7a9fff; }
.pnl-split-tag.manual { background: rgba(255,193,7,.15);  color: var(--yellow); }

/* ── Stats tiles ─────────────────────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
@media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

.stat-tile {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}
.stat-label { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; margin-bottom: 6px; }
.stat-val   { font-family: var(--mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-note  { font-size: 11px; color: var(--fg2); margin-top: 3px; }
.c-green  { color: var(--green); }
.c-red    { color: var(--red); }
.c-yellow { color: var(--yellow); }
.c-fg     { color: var(--fg); }

/* ── Section heading ─────────────────────────────────────────────────────────── */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-label { font-size: 11px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .09em; }
.section-meta  { font-family: var(--mono); font-size: 11px; color: var(--fg3); }

/* ── Position cards ──────────────────────────────────────────────────────────── */
.pos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}

.pos-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.pos-card::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--border);
}
.pos-card.profit::after { background: var(--green); }
.pos-card.loss::after   { background: var(--red); }

.pos-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.pos-sym  { font-size: 17px; font-weight: 600; }
.pos-name { font-size: 11px; color: var(--fg2); margin-top: 1px; }
.pos-right { text-align: right; }
.cat-badge {
  display: inline-block;
  font-size: 10px; padding: 2px 8px; border-radius: 20px;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--fg2); white-space: nowrap;
}
.pos-score { font-family: var(--mono); font-size: 10px; color: var(--fg3); margin-top: 4px; }

.price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 13px; }
.price-block { }
.price-block .plabel { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .05em; }
.price-block .pval   { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 1px; }

/* Progress track */
.track-wrap { margin-bottom: 13px; }
.track-top  { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; margin-bottom: 5px; }
.track-rail { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.track-fill { height: 100%; border-radius: 3px; transition: width .5s ease; min-width: 2px; }
.track-fill.profit { background: var(--green); }
.track-fill.loss   { background: var(--red); }
.track-tps  { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--fg3); margin-top: 4px; }

.pos-foot { display: flex; align-items: flex-end; justify-content: space-between; }
.pnl-big  { font-family: var(--mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pnl-pct  { font-size: 11px; color: var(--fg2); }
.pos-ts   { font-size: 10px; color: var(--fg3); text-align: right; }

/* ── History table ───────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 30px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }
thead tr { background: var(--bg3); }
th { padding: 10px 14px; font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; text-align: left; white-space: nowrap; }
td { padding: 10px 14px; border-top: 1px solid var(--border); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-sym { font-family: var(--sans); font-weight: 600; font-size: 13px; }
tbody tr:hover td { background: var(--bg3); }

/* ── Manual queue section ────────────────────────────────────────────────────── */
.manual-section {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 16px; margin-bottom: 28px;
}
.manual-title {
  font-size: 12px; font-weight: 700; color: var(--fg2);
  text-transform: uppercase; letter-spacing: .09em; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.manual-form {
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.manual-input {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  color: var(--fg); font-family: var(--mono); font-size: 12px;
  padding: 9px 12px; outline: none; transition: border-color .15s;
}
.manual-input:focus { border-color: var(--accent); }
.manual-input.addr { flex: 1 1 220px; min-width: 0; }
.manual-input.size { width: 88px; flex-shrink: 0; }
.manual-add-btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 9px 16px; font-size: 13px;
  font-weight: 600; font-family: var(--sans); cursor: pointer;
  white-space: nowrap; transition: opacity .15s;
}
.manual-add-btn:hover { opacity: .85; }
.manual-add-btn:disabled { opacity: .45; cursor: not-allowed; }
.manual-sym-preview {
  font-size: 11px; color: var(--green); margin-top: -4px; margin-bottom: 4px;
  min-height: 16px; font-family: var(--mono);
}
.manual-queue-list { display: flex; flex-direction: column; gap: 8px; }
.manual-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font-size: 12px;
}
.manual-item-sym { font-weight: 700; font-size: 13px; min-width: 56px; }
.manual-item-addr { font-family: var(--mono); color: var(--fg3); font-size: 10px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.manual-item-size { font-family: var(--mono); color: var(--yellow); white-space: nowrap; }
.manual-item-status { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.manual-item-status.pending  { color: var(--yellow); }
.manual-item-status.entered  { color: var(--green); }
.manual-item-status.failed   { color: var(--red); }
.manual-item-del {
  background: none; border: none; color: var(--fg3); font-size: 14px;
  cursor: pointer; padding: 0 2px; line-height: 1; flex-shrink: 0;
}
.manual-item-del:hover { color: var(--red); }
.manual-empty { font-size: 12px; color: var(--fg3); text-align: center; padding: 8px 0; }

/* ── Bot control button ──────────────────────────────────────────────────────── */
.bot-ctrl {
  display: flex; align-items: center; gap: 7px;
  border: none; border-radius: 8px;
  padding: 7px 14px; font-size: 13px; font-weight: 600;
  font-family: var(--sans); cursor: pointer;
  transition: opacity .15s, transform .1s;
  white-space: nowrap;
}
.bot-ctrl:hover  { opacity: .85; }
.bot-ctrl:active { transform: scale(.97); }
.bot-ctrl.running {
  background: rgba(232,83,74,.15); color: var(--red);
  border: 1px solid rgba(232,83,74,.4);
}
.bot-ctrl.stopped {
  background: rgba(46,194,126,.15); color: var(--green);
  border: 1px solid rgba(46,194,126,.4);
}
.bot-ctrl.unknown {
  background: var(--bg3); color: var(--fg3);
  border: 1px solid var(--border);
}
.bot-ctrl-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.bot-ctrl.running  .bot-ctrl-dot { background: var(--red);   animation: blink 1.4s ease-in-out infinite; }
.bot-ctrl.stopped  .bot-ctrl-dot { background: var(--green); }
.bot-ctrl.unknown  .bot-ctrl-dot { background: var(--fg3); }

/* ── Misc ────────────────────────────────────────────────────────────────────── */
.empty-state {
  text-align: center; padding: 44px 16px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 11px;
  margin-bottom: 28px; color: var(--fg3);
}
.empty-state .ei { font-size: 30px; margin-bottom: 10px; }
.empty-state p   { font-size: 13px; margin: 0; }

.loader { text-align: center; padding: 40px; color: var(--fg3); font-size: 13px; }
.spin {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--bg3); border-top-color: var(--accent);
  border-radius: 50%; animation: rot .65s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes rot { to { transform: rotate(360deg) } }

.err-box {
  background: rgba(232,83,74,.08); border: 1px solid rgba(232,83,74,.25);
  border-radius: 9px; color: var(--red); padding: 12px 16px;
  font-size: 13px; margin-bottom: 18px; line-height: 1.5;
}
</style>

<div id="root"></div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  config: null,
  positions: [],
  history: [],
  stats: null,
  prices: {},
  loading: false,
  error: null,
  lastUpdated: null,
  botRunning: null,   // null=unknown, true=running, false=stopped
  toggling: false,    // prevent double-tap
  manualQueue: [],    // items in paper_manual_queue
  manualAdding: false,
  closingPos: {},     // { [posId]: 'confirm' | 'closing' }
};

// ── Config store ──────────────────────────────────────────────────────────────
function loadCfg() {
  try { const r = localStorage.getItem('mscan_cfg'); return r ? JSON.parse(r) : null; } catch { return null; }
}
function saveCfg(c) {
  try { localStorage.setItem('mscan_cfg', JSON.stringify(c)); } catch {}
}

// ── Firestore REST helpers ────────────────────────────────────────────────────
function base(cfg) {
  return `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents`;
}

function parseVal(v) {
  if (!v) return null;
  if ('stringValue'  in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue'  in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue'    in v) return null;
  return null;
}

function parseDoc(doc) {
  if (!doc?.fields) return null;
  const o = { _id: doc.name?.split('/').pop() };
  for (const [k, v] of Object.entries(doc.fields)) o[k] = parseVal(v);
  return o;
}

async function fsQuery(cfg, coll, field, value) {
  const url = `${base(cfg)}:runQuery?key=${cfg.apiKey}`;
  const q = { structuredQuery: { from: [{ collectionId: coll }], limit: 25 } };
  if (field) {
    q.structuredQuery.where = { fieldFilter: { field: { fieldPath: field }, op: 'EQUAL', value: { stringValue: value } } };
  }
  if (!field) {
    q.structuredQuery.orderBy = [{ field: { fieldPath: 'enteredAt' }, direction: 'DESCENDING' }];
  }
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(q) });
  if (!r.ok) { const t = await r.text(); throw new Error(`Firestore ${r.status}: ${t.slice(0,120)}`); }
  const rows = await r.json();
  return rows.map(x => x.document ? parseDoc(x.document) : null).filter(Boolean);
}

async function fsGet(cfg, coll, id) {
  const r = await fetch(`${base(cfg)}/${coll}/${id}?key=${cfg.apiKey}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`Firestore ${r.status}`);
  return parseDoc(await r.json());
}

async function fsAdd(cfg, coll, fields) {
  // POST to collection — Firestore auto-generates ID
  const fsFields = {};
  for (const [k, v] of Object.entries(fields)) {
    if (typeof v === 'boolean') fsFields[k] = { booleanValue: v };
    else if (typeof v === 'number') fsFields[k] = { doubleValue: v };
    else fsFields[k] = { stringValue: String(v) };
  }
  const url = `${base(cfg)}/${coll}?key=${cfg.apiKey}`;
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: fsFields }),
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`Firestore add ${r.status}: ${t.slice(0,120)}`); }
  return parseDoc(await r.json());
}

async function fsDelete(cfg, coll, id) {
  const r = await fetch(`${base(cfg)}/${coll}/${id}?key=${cfg.apiKey}`, { method: 'DELETE' });
  if (!r.ok && r.status !== 404) throw new Error(`Firestore delete ${r.status}`);
}

async function fsSet(cfg, coll, id, fields) {
  // Build Firestore field map
  const fsFields = {};
  for (const [k, v] of Object.entries(fields)) {
    if (typeof v === 'boolean') fsFields[k] = { booleanValue: v };
    else if (typeof v === 'number') fsFields[k] = { doubleValue: v };
    else fsFields[k] = { stringValue: String(v) };
  }
  const fieldPaths = Object.keys(fields).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
  const url = `${base(cfg)}/${coll}/${id}?key=${cfg.apiKey}&${fieldPaths}`;
  const r = await fetch(url, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: fsFields }),
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`Firestore set ${r.status}: ${t.slice(0,120)}`); }
  return parseDoc(await r.json());
}

// ── DexScreener ───────────────────────────────────────────────────────────────
async function fetchPrice(addr) {
  try {
    const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`);
    const d = await r.json();
    if (!d.pairs?.length) return null;
    d.pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
    return parseFloat(d.pairs[0].priceUsd) || null;
  } catch { return null; }
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  if (!S.config) return;
  S.loading = true; S.error = null;
  render();
  try {
    const today = new Date().toISOString().slice(0, 10);
    const [positions, history, statsDoc, ctrlDoc, manualQueue] = await Promise.all([
      fsQuery(S.config, 'paper_positions', 'status', 'open'),
      fsQuery(S.config, 'paper_history'),
      fsGet(S.config, 'paper_stats', today),
      fsGet(S.config, 'paper_config', 'control'),
      fsQuery(S.config, 'paper_manual_queue'),
    ]);
    S.positions = positions;
    S.history = history.slice(0, 15);
    S.stats = statsDoc;
    S.botRunning = ctrlDoc ? (ctrlDoc.running !== false) : true;
    S.manualQueue = manualQueue.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).slice(0, 20);
    // Live prices
    const addrs = [...new Set(positions.map(p => p.address).filter(Boolean))];
    await Promise.all(addrs.map(async a => { const p = await fetchPrice(a); if (p) S.prices[a] = p; }));
    S.lastUpdated = new Date();
  } catch (e) { S.error = e.message; }
  S.loading = false;
  render();
}

// ── Format helpers ────────────────────────────────────────────────────────────
function fmtPrice(p) {
  if (p == null || p === 0) return '—';
  if (p < 0.000001) return '$' + p.toFixed(10).replace(/\.?0+$/, '');
  if (p < 0.0001)   return '$' + p.toFixed(8).replace(/0+$/, '');
  if (p < 0.01)     return '$' + p.toFixed(6).replace(/0+$/, '');
  if (p < 1)        return '$' + p.toFixed(4);
  return '$' + p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtPnl(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + '$' + Math.abs(n).toFixed(2);
}

function fmtPct(n) {
  if (n == null) return '';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) + ' ' +
         d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function livePnl(pos) {
  const cur = S.prices[pos.address];
  if (!cur) return null;
  return (cur - pos.entryPrice) / pos.entryPrice * pos.size * (pos.remaining ?? 1);
}

function livePct(pos) {
  const cur = S.prices[pos.address];
  if (!cur) return null;
  return (cur - pos.entryPrice) / pos.entryPrice * 100;
}

function trackFill(pos) {
  const cur = S.prices[pos.address];
  if (!cur) return 50;
  const range = pos.tp3 - pos.sl;
  if (range <= 0) return 50;
  return Math.max(2, Math.min(98, (cur - pos.sl) / range * 100));
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');

  if (!S.config) {
    root.innerHTML = `
      <div class="setup">
        <div class="setup-icon">📊</div>
        <h1>MemeScan PRO Dashboard</h1>
        <p class="sub">Connect to Firebase to monitor your paper trading bot live.</p>
        <label class="field-label" for="pid">Firebase Project ID</label>
        <input class="field-input" id="pid" value="memescan-pro" placeholder="your-project-id">
        <label class="field-label" for="akey">Web API Key</label>
        <input class="field-input" id="akey" placeholder="AIzaSy…">
        <p class="field-hint">Firebase Console → Project Settings → General → Web API Key</p>
        <button class="btn" onclick="doSetup()">Connect →</button>
        <p class="setup-err" id="serr" style="display:none"></p>
      </div>`;
    return;
  }

  const s = S.stats || {};
  const openLivePnl = S.positions.reduce((sum, p) => sum + (livePnl(p) || 0), 0);
  const portfolio = 500 + (s.realizedPnL || 0) + openLivePnl;
  const todayPnl  = s.realizedPnL || 0;
  const winRate   = s.trades > 0 ? Math.round(s.wins / s.trades * 100) : null;
  const updTime   = S.lastUpdated
    ? S.lastUpdated.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
    : '—';

  // Positions HTML
  let posHTML = '';
  if (S.loading) {
    posHTML = `<div class="loader"><span class="spin"></span>Loading positions…</div>`;
  } else if (!S.positions.length) {
    posHTML = `<div class="empty-state"><div class="ei">👀</div><p>No open positions — bot is scanning for signals</p></div>`;
  } else {
    posHTML = `<div class="pos-grid">${S.positions.map(posCard).join('')}</div>`;
  }

  // History HTML
  let histHTML = '';
  if (!S.loading && !S.history.length) {
    histHTML = `<div class="empty-state" style="margin-bottom:0"><div class="ei">📜</div><p>No closed trades yet</p></div>`;
  } else if (!S.loading) {
    const rows = S.history.map(t => {
      const pnl = t.pnl || 0;
      const pct = t.entryPrice && t.exitPrice ? (t.exitPrice - t.entryPrice) / t.entryPrice * 100 : null;
      return `<tr>
        <td class="td-sym">${t.symbol || '?'}</td>
        <td>${fmtPrice(t.entryPrice)}</td>
        <td>${fmtPrice(t.exitPrice)}</td>
        <td class="${pct >= 0 ? 'c-green' : 'c-red'}">${pct != null ? fmtPct(pct) : '—'}</td>
        <td class="${pnl >= 0 ? 'c-green' : 'c-red'}">${fmtPnl(pnl)}</td>
        <td style="color:var(--fg2)">${t.exitReason || '—'}</td>
        <td style="color:var(--fg3)">${fmtDate(t.closedAt)}</td>
      </tr>`;
    }).join('');
    histHTML = `<div class="table-wrap">
      <table>
        <thead><tr><th>Token</th><th>Entry</th><th>Exit</th><th>%</th><th>P&amp;L</th><th>Reason</th><th>Closed</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  const errHTML = S.error
    ? `<div class="err-box">⚠ ${S.error}<br><small>Check your API key and Firestore security rules.</small></div>`
    : '';

  root.innerHTML = `
    <div id="app">
      <header>
        <div class="logo-row">
          <div class="logo-icon">📊</div>
          <div>
            <div class="logo-name">MemeScan PRO Bot</div>
            <div class="logo-sub">Paper Trading Dashboard</div>
          </div>
        </div>
        <div class="header-right">
          ${S.lastUpdated ? `<div class="live-badge"><div class="live-dot"></div>LIVE</div>` : ''}
          <span class="update-time">${updTime}</span>
          ${botCtrlBtn()}
          <button class="btn-ghost" onclick="loadData()">⟳ Refresh</button>
          <button class="btn-link" onclick="disconnect()">Disconnect</button>
        </div>
      </header>

      ${errHTML}

      <div class="stats-grid">
        <div class="stat-tile">
          <div class="stat-label">Portfolio</div>
          <div class="stat-val c-fg">$${portfolio.toFixed(2)}</div>
          <div class="stat-note">Paper balance</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Today's P&amp;L</div>
          <div class="stat-val ${todayPnl >= 0 ? 'c-green' : 'c-red'}">${fmtPnl(todayPnl)}</div>
          <div class="stat-note">${s.trades || 0} trades closed</div>
          ${(s.autoTrades || s.manualTrades) ? `<div class="pnl-split">
            <span class="pnl-split-tag auto">Bot</span><span>${fmtPnl(s.autoPnL || 0)}</span>
            <span class="pnl-split-tag manual">Manual</span><span>${fmtPnl(s.manualPnL || 0)}</span>
          </div>` : ''}
        </div>
        <div class="stat-tile">
          <div class="stat-label">Win Rate</div>
          <div class="stat-val ${winRate == null ? 'c-fg' : winRate >= 50 ? 'c-green' : 'c-red'}">${winRate != null ? winRate + '%' : '—'}</div>
          <div class="stat-note">${s.wins || 0}W / ${s.losses || 0}L</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Positions</div>
          <div class="stat-val c-fg">${S.positions.length}<span style="font-size:13px;color:var(--fg3)">/10</span></div>
          <div class="stat-note">open now</div>
        </div>
      </div>

      ${manualQueueHTML()}

      <div class="section-head">
        <span class="section-label">Open Positions</span>
        <span class="section-meta">${S.positions.length} active</span>
      </div>
      ${posHTML}

      <div class="section-head">
        <span class="section-label">Trade History</span>
        <span class="section-meta">${S.history.length} closed</span>
      </div>
      ${histHTML}
    </div>`;
}

function posCard(pos) {
  const pnl  = livePnl(pos);
  const pct  = livePct(pos);
  const fill = trackFill(pos);
  const cur  = S.prices[pos.address];
  const isProfit = pnl != null && pnl >= 0;
  const cardClass = pnl == null ? '' : isProfit ? 'profit' : 'loss';

  return `<div class="pos-card ${cardClass}">
    <div class="pos-head">
      <div>
        <div class="pos-sym">${pos.symbol || '?'}</div>
        <div class="pos-name">${pos.name || ''}</div>
      </div>
      <div class="pos-right">
        <span class="cat-badge">${pos.strategyLabel || pos.catLabel || ''}</span>
        <div class="pos-score">Score ${pos.score || '—'}/100</div>
      </div>
    </div>

    <div class="price-row">
      <div class="price-block">
        <div class="plabel">Entry</div>
        <div class="pval">${fmtPrice(pos.entryPrice)}</div>
      </div>
      <div class="price-block">
        <div class="plabel">Current</div>
        <div class="pval ${cur ? (cur >= pos.entryPrice ? 'c-green' : 'c-red') : ''}">${cur ? fmtPrice(cur) : '…'}</div>
      </div>
    </div>

    <div class="track-wrap">
      <div class="track-top">
        <span style="color:var(--red)">SL ${fmtPrice(pos.sl)}</span>
        <span style="color:var(--fg3)">Entry ${fmtPrice(pos.entryPrice)}</span>
        <span style="color:var(--green)">TP3 ${fmtPrice(pos.tp3)}</span>
      </div>
      <div class="track-rail">
        <div class="track-fill ${isProfit ? 'profit' : 'loss'}" style="width:${fill}%"></div>
      </div>
      <div class="track-tps">
        <span style="color:var(--red)">▸ SL</span>
        <span>TP1 ${fmtPrice(pos.tp1)}</span>
        <span>TP2 ${fmtPrice(pos.tp2)}</span>
        <span style="color:var(--green)">TP3 ◂</span>
      </div>
    </div>

    <div class="pos-foot">
      <div>
        <div class="pnl-big ${pnl != null ? (pnl >= 0 ? 'c-green' : 'c-red') : ''}">${fmtPnl(pnl)}</div>
        <div class="pnl-pct">${pct != null ? fmtPct(pct) : 'fetching price…'}${pos.isManual ? ' · <span style="color:var(--yellow);font-size:9px">🎯 MANUAL</span>' : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
        <div class="pos-ts">$${pos.size} · ${fmtDate(pos.enteredAt)}</div>
        ${sellBtn(pos)}
      </div>
    </div>
  </div>`;
}

// ── Individual position sell ──────────────────────────────────────────────────
function sellBtn(pos) {
  const state = S.closingPos[pos._id];
  if (state === 'closing') {
    return `<button class="sell-btn" disabled>…selling</button>`;
  }
  if (state === 'confirm') {
    return `<button class="sell-btn confirm" onclick="confirmSell('${pos._id}')">Confirm Sell?</button>`;
  }
  return `<button class="sell-btn" onclick="requestSell('${pos._id}')">🛑 Sell Now</button>`;
}

function requestSell(posId) {
  S.closingPos[posId] = 'confirm';
  render();
  // Auto-cancel confirm state after 4 seconds if not tapped again
  setTimeout(() => {
    if (S.closingPos[posId] === 'confirm') {
      delete S.closingPos[posId];
      render();
    }
  }, 4000);
}

async function confirmSell(posId) {
  if (!S.config || S.closingPos[posId] === 'closing') return;
  S.closingPos[posId] = 'closing';
  render();
  try {
    await fsSet(S.config, 'paper_positions', posId, { closeRequested: true });
    // Wait a moment then reload — bot will pick it up within 5s
    setTimeout(() => { delete S.closingPos[posId]; loadData(); }, 6000);
  } catch (e) {
    S.error = 'Sell request failed: ' + e.message;
    delete S.closingPos[posId];
    render();
  }
}

// ── Manual queue UI ───────────────────────────────────────────────────────────
function manualQueueHTML() {
  const statusIcon = { pending: '⏳', entered: '✅', failed: '❌' };

  const items = S.manualQueue.length
    ? S.manualQueue.map(item => `
        <div class="manual-item">
          <span class="manual-item-sym">${item.symbol || '?'}</span>
          <span class="manual-item-addr" title="${item.address}">${item.address}</span>
          <span class="manual-item-size">$${item.size || 100}</span>
          <span class="manual-item-status ${item.status}">${statusIcon[item.status] || ''} ${item.status}</span>
          ${item.status === 'pending'
            ? `<button class="manual-item-del" onclick="removeManualToken('${item._id}')" title="Cancel">✕</button>`
            : ''}
        </div>`).join('')
    : `<div class="manual-empty">No tokens queued — add one above</div>`;

  return `
    <div class="manual-section">
      <div class="manual-title">🎯 Manual Token Queue</div>
      <div class="manual-form">
        <input class="manual-input addr" id="m-addr" placeholder="Contract address (0x… or token CA)" autocomplete="off" spellcheck="false">
        <input class="manual-input size" id="m-size" type="number" placeholder="$" min="10" step="10" value="100">
        <button class="manual-add-btn" id="m-addbtn" onclick="addManualToken()" ${S.manualAdding ? 'disabled' : ''}>
          ${S.manualAdding ? '…' : '+ Add'}
        </button>
      </div>
      <div class="manual-queue-list">${items}</div>
    </div>`;
}

async function addManualToken() {
  if (!S.config || S.manualAdding) return;
  const addrEl = document.getElementById('m-addr');
  const sizeEl = document.getElementById('m-size');
  const addr   = addrEl?.value.trim();
  const size   = parseFloat(sizeEl?.value) || 100;
  if (!addr) { addrEl?.focus(); return; }

  S.manualAdding = true;
  render();

  try {
    // Try to resolve symbol from DexScreener first
    let symbol = '?';
    try {
      const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`);
      const d = await r.json();
      if (d.pairs?.length) {
        d.pairs.sort((a,b) => (b.liquidity?.usd||0) - (a.liquidity?.usd||0));
        symbol = d.pairs[0].baseToken?.symbol || '?';
      }
    } catch {}

    await fsAdd(S.config, 'paper_manual_queue', {
      address: addr,
      symbol,
      size,
      status: 'pending',
      addedAt: Date.now(),
    });

    if (addrEl) addrEl.value = '';
    await loadData();
  } catch (e) {
    S.error = 'Queue failed: ' + e.message;
  }
  S.manualAdding = false;
  render();
}

async function removeManualToken(id) {
  if (!S.config || !id) return;
  try {
    await fsDelete(S.config, 'paper_manual_queue', id);
    S.manualQueue = S.manualQueue.filter(x => x._id !== id);
    render();
  } catch (e) { S.error = 'Remove failed: ' + e.message; render(); }
}

// ── Bot control ───────────────────────────────────────────────────────────────
function botCtrlBtn() {
  if (S.botRunning === null) {
    return `<button class="bot-ctrl unknown" onclick="toggleBot()" title="Loading bot status…">
      <span class="bot-ctrl-dot"></span>…
    </button>`;
  }
  if (S.toggling) {
    return `<button class="bot-ctrl unknown" disabled style="opacity:.5">
      <span class="spin" style="width:10px;height:10px;border-width:2px"></span>…
    </button>`;
  }
  if (S.botRunning) {
    return `<button class="bot-ctrl running" onclick="toggleBot()" title="Tap to pause the bot">
      <span class="bot-ctrl-dot"></span>🛑 Stop Bot
    </button>`;
  }
  return `<button class="bot-ctrl stopped" onclick="toggleBot()" title="Tap to resume scanning">
    <span class="bot-ctrl-dot"></span>▶ Start Bot
  </button>`;
}

async function toggleBot() {
  if (!S.config || S.toggling) return;
  S.toggling = true;
  render();
  try {
    const newState = !S.botRunning;
    await fsSet(S.config, 'paper_config', 'control', { running: newState });
    S.botRunning = newState;
  } catch (e) {
    S.error = 'Bot control failed: ' + e.message;
  }
  S.toggling = false;
  render();
}

// ── Actions ───────────────────────────────────────────────────────────────────
function doSetup() {
  const pid  = document.getElementById('pid')?.value.trim();
  const akey = document.getElementById('akey')?.value.trim();
  const err  = document.getElementById('serr');
  if (!pid || !akey) {
    if (err) { err.style.display = ''; err.textContent = 'Both fields are required.'; }
    return;
  }
  S.config = { projectId: pid, apiKey: akey };
  saveCfg(S.config);
  loadData();
}

function disconnect() {
  S.config = null;
  try { localStorage.removeItem('mscan_cfg'); } catch {}
  render();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
S.config = loadCfg();
render();
if (S.config) loadData();
setInterval(() => { if (S.config && !S.loading) loadData(); }, 30000);
</script>
